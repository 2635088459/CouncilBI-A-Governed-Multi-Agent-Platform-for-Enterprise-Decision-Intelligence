[project]
name = "governed-chatbi-platform"
version = "0.1.0"
description = "Governed multi-agent ChatBI platform for enterprise decision intelligence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "fastapi>=0.115.0",
    "openpyxl>=3.1.0",
    "psycopg[binary]>=3.2.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
chatbi-build-frontend = "chatbi.frontend.build_static:main"
chatbi-seed-final = "chatbi.final_seed:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pyright>=1.1.350",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
