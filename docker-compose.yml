services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: governed-chatbi-frontend:local
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: governed-chatbi-backend:local
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CHATBI_READONLY_DATABASE_URL: ${CHATBI_READONLY_DATABASE_URL:?CHATBI_READONLY_DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE_URL: memory://local-vector-store
      CHATBI_USE_POSTGRES_METADATA: "1"
      CHATBI_LLM_PROVIDER: ${CHATBI_LLM_PROVIDER:-mock}
      CHATBI_LLM_MODEL: ${CHATBI_LLM_MODEL:-}
      CHATBI_LLM_TIMEOUT_MS: ${CHATBI_LLM_TIMEOUT_MS:-1000}
      CHATBI_LLM_MAX_RETRIES: ${CHATBI_LLM_MAX_RETRIES:-1}
      CHATBI_LLM_BACKOFF_MS: ${CHATBI_LLM_BACKOFF_MS:-25}
      CHATBI_EMBEDDING_PROVIDER: ${CHATBI_EMBEDDING_PROVIDER:-mock}
      CHATBI_EMBEDDING_MODEL: ${CHATBI_EMBEDDING_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: governed-chatbi-worker:local
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CHATBI_READONLY_DATABASE_URL: ${CHATBI_READONLY_DATABASE_URL:?CHATBI_READONLY_DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE_URL: memory://local-vector-store
      CHATBI_USE_POSTGRES_METADATA: "1"
      CHATBI_LLM_PROVIDER: ${CHATBI_LLM_PROVIDER:-mock}
      CHATBI_LLM_MODEL: ${CHATBI_LLM_MODEL:-}
      CHATBI_LLM_TIMEOUT_MS: ${CHATBI_LLM_TIMEOUT_MS:-1000}
      CHATBI_LLM_MAX_RETRIES: ${CHATBI_LLM_MAX_RETRIES:-1}
      CHATBI_LLM_BACKOFF_MS: ${CHATBI_LLM_BACKOFF_MS:-25}
      CHATBI_EMBEDDING_PROVIDER: ${CHATBI_EMBEDDING_PROVIDER:-mock}
      CHATBI_EMBEDDING_MODEL: ${CHATBI_EMBEDDING_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatbi
      POSTGRES_USER: chatbi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CHATBI_READONLY_PASSWORD: ${CHATBI_READONLY_PASSWORD:?CHATBI_READONLY_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - chatbi_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U chatbi -d chatbi
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  chatbi_postgres_data:
