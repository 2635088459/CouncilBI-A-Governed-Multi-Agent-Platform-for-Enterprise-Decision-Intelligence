services:
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    environment:
      API_BASE_URL: http://backend:8000
      BACKEND_API_URL: http://backend:8000
      FRONTEND_ENVIRONMENT: dev
      FRONTEND_LOCALE_DEFAULT: en
    command:
      - /bin/sh
      - -c
      - |
        cat >/usr/share/nginx/html/index.html <<'HTML'
        <!doctype html>
        <html lang="en">
          <head><meta charset="utf-8"><title>Governed ChatBI</title></head>
          <body>
            <main>
              <h1>Governed ChatBI</h1>
              <p>Backend API: http://localhost:8000</p>
            </main>
          </body>
        </html>
        HTML
        nginx -g 'daemon off;'

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://chatbi:chatbi_password@postgres:5432/chatbi
      CHATBI_READONLY_DATABASE_URL: postgresql://chatbi_readonly:chatbi_readonly_password@postgres:5432/chatbi
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE_URL: memory://local-vector-store
      CHATBI_USE_POSTGRES_METADATA: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        pip install -e .
        uvicorn chatbi.api.http:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://chatbi:chatbi_password@postgres:5432/chatbi
      CHATBI_READONLY_DATABASE_URL: postgresql://chatbi_readonly:chatbi_readonly_password@postgres:5432/chatbi
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE_URL: memory://local-vector-store
      CHATBI_USE_POSTGRES_METADATA: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        pip install -e .
        python -c "import time; print('chatbi worker ready', flush=True); time.sleep(10**9)"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatbi
      POSTGRES_USER: chatbi
      POSTGRES_PASSWORD: chatbi_password
    ports:
      - "5432:5432"
    volumes:
      - chatbi_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U chatbi -d chatbi
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  chatbi_postgres_data:
