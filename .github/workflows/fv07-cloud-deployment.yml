name: FV07 Cloud Deployment

on:
  pull_request:
    paths:
      - "Dockerfile.*"
      - ".dockerignore"
      - "k8s/**"
      - "src/chatbi/**"
      - "tests/**"
      - "spec/final-version/**"
      - ".github/workflows/fv07-cloud-deployment.yml"
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Deploy to staging after tests and image builds"
        required: false
        default: "false"

jobs:
  build-test-release:
    name: tests -> images -> release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Type check deployment contracts
        run: |
          python -m pyright \
            tests/test_dockerfiles.py \
            tests/test_k8s_runtime_architecture.py \
            tests/test_runtime_probes.py

      - name: Test deployment contracts
        run: |
          python -m pytest \
            tests/test_dockerfiles.py \
            tests/test_k8s_runtime_architecture.py \
            tests/test_docker_compose_architecture.py \
            tests/test_runtime_probes.py \
            tests/test_runtime_latency_smoke.py

      - name: Build backend image
        run: |
          docker build -f Dockerfile.backend -t governed-chatbi-backend:${{ github.sha }} .

      - name: Build worker image
        run: |
          docker build -f Dockerfile.worker -t governed-chatbi-worker:${{ github.sha }} .

      - name: Build frontend image
        run: |
          docker build -f Dockerfile.frontend -t governed-chatbi-frontend:${{ github.sha }} .

      - name: Release gate
        run: |
          python -m pytest \
            tests/test_release_gate.py \
            tests/test_release_gate_ci.py

  staging-deploy-smoke:
    name: staging deploy -> smoke -> rollback command check
    runs-on: ubuntu-latest
    needs: build-test-release
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_staging == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.STAGING_KUBE_CONFIG_B64 }}
        run: |
          test -n "$KUBE_CONFIG_B64"
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"

      - name: Deploy staging manifests
        run: |
          kubectl apply -f k8s/chatbi-runtime.yaml
          kubectl rollout status deployment/backend -n chatbi --timeout=180s
          kubectl rollout status deployment/frontend -n chatbi --timeout=180s
          kubectl rollout status deployment/worker -n chatbi --timeout=180s

      - name: Smoke staging health endpoints
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          test -n "$STAGING_BASE_URL"
          curl --fail --max-time 2 "$STAGING_BASE_URL/healthz"
          curl --fail --max-time 2 "$STAGING_BASE_URL/readyz"

      - name: Smoke authenticated API path
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          STAGING_AUTH_TOKEN: ${{ secrets.STAGING_AUTH_TOKEN }}
        run: |
          test -n "$STAGING_BASE_URL"
          test -n "$STAGING_AUTH_TOKEN"
          curl --fail --max-time 5 \
            -H "Authorization: Bearer $STAGING_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Trace-Id: trc_staging_smoke" \
            -d '{"request_id":"req_staging_smoke","session_id":"ses_staging_smoke","user_id":"u_staging","role":"business_user","locale":"en","question":"Show revenue trend."}' \
            "$STAGING_BASE_URL/api/v2/chat/query"

      - name: Print rollback command
        if: failure()
        run: |
          kubectl rollout undo deployment/backend -n chatbi
          kubectl rollout undo deployment/frontend -n chatbi
          kubectl rollout undo deployment/worker -n chatbi
