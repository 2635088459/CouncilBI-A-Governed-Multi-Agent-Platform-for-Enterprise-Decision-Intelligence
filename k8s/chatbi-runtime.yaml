apiVersion: v1
kind: Namespace
metadata:
  name: chatbi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbi-runtime-config
  namespace: chatbi
data:
  VECTOR_STORE_URL: memory://local-vector-store
  CHATBI_USE_POSTGRES_METADATA: "1"
  API_BASE_URL: http://backend:8000
  FRONTEND_ENVIRONMENT: prod
  FRONTEND_LOCALE_DEFAULT: en
  BACKEND_API_URL: http://backend:8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbi-managed-service-config
  namespace: chatbi
data:
  REDIS_URL: redis://redis:6379/0
  POSTGRES_DB: chatbi
  POSTGRES_USER: chatbi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chatbi
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: governed-chatbi-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chatbi-runtime-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: chatbi-managed-service-config
                  key: REDIS_URL
            - name: VECTOR_STORE_URL
              valueFrom:
                configMapKeyRef:
                  name: chatbi-runtime-config
                  key: VECTOR_STORE_URL
            - name: CHATBI_USE_POSTGRES_METADATA
              valueFrom:
                configMapKeyRef:
                  name: chatbi-runtime-config
                  key: CHATBI_USE_POSTGRES_METADATA
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: chatbi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: chatbi
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: chatbi
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: governed-chatbi-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: chatbi-runtime-config
                  key: API_BASE_URL
            - name: FRONTEND_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: chatbi-runtime-config
                  key: FRONTEND_ENVIRONMENT
            - name: FRONTEND_LOCALE_DEFAULT
              valueFrom:
                configMapKeyRef:
                  name: chatbi-runtime-config
                  key: FRONTEND_LOCALE_DEFAULT
            - name: BACKEND_API_URL
              valueFrom:
                configMapKeyRef:
                  name: chatbi-runtime-config
                  key: BACKEND_API_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chatbi
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatbi-web
  namespace: chatbi
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: chatbi
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: governed-chatbi-platform:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - "import time; print('chatbi worker ready', flush=True); time.sleep(10**9)"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chatbi-runtime-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: chatbi-managed-service-config
                  key: REDIS_URL
            - name: VECTOR_STORE_URL
              valueFrom:
                configMapKeyRef:
                  name: chatbi-runtime-config
                  key: VECTOR_STORE_URL
            - name: CHATBI_USE_POSTGRES_METADATA
              valueFrom:
                configMapKeyRef:
                  name: chatbi-runtime-config
                  key: CHATBI_USE_POSTGRES_METADATA
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: chatbi
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: chatbi
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chatbi
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: chatbi-managed-service-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: chatbi-managed-service-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chatbi-runtime-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - chatbi
                - -d
                - chatbi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chatbi
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
